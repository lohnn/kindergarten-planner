services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kinder.rule=PathPrefix(`/`)"
      - "traefik.http.routers.kinder.entrypoints=web"
      - "traefik.http.services.kinder.loadbalancer.server.port=3000"
